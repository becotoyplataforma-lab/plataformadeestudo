# ============================================================
# ConcursoAI — app.becotoy.com (Sprint 18.1)
# Cloudflare (proxy/DNS) → Nginx (80/443) → app:3000 (Docker)
# ============================================================

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.becotoy.com;

    # IP real por trás do Cloudflare (descomente se ativar)
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # real_ip_header CF-Connecting-IP;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.becotoy.com;

    # Certificado: Cloudflare Origin Certificate (gratuito, 15 anos) ou Let's Encrypt.
    # Monte os arquivos em infra/certs/ (docker-compose já monta em /etc/nginx/certs).
    ssl_certificate     /etc/nginx/certs/app.becotoy.com.pem;
    ssl_certificate_key /etc/nginx/certs/app.becotoy.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Uploads (ex.: documentos do Knowledge Engine)
    client_max_body_size 10m;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — SSL termina no nginx (Cloudflare Origin Cert). 31536000 = 1 ano.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: descomente com cautela — Next.js pode exigir 'unsafe-inline' em style-src.
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.supabase.co https://*.r2.dev; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co" always;

    # Rotas gerais
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Rotas de IA com streaming — não bufferizar
    location ~ ^/api/(ai|professor|chat)(/|$) {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Healthcheck
    location = /api/health {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
    }
}
