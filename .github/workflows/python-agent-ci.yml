# ============================================================
# ConcursoAI — CI do agente Python derived_copy_cleaner
# Roda os testes do agente derived_copy_cleaner (pytest) em cada
# push/PR que toque em agents/derived_copy_cleaner/, pytest.ini ou
# neste workflow. Escopo intencionalmente restrito ao agente cujo
# requirements.txt e job name este CI cobre; o pdf_question_extractor
# tem cobertura própria fora deste workflow.
# ============================================================
name: CI (Python agent)

on:
  push:
    branches: [main]
    paths:
      - "agents/derived_copy_cleaner/**"
      - "pytest.ini"
      - ".github/workflows/python-agent-ci.yml"
  pull_request:
    paths:
      - "agents/derived_copy_cleaner/**"
      - "pytest.ini"
      - ".github/workflows/python-agent-ci.yml"
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (derived_copy_cleaner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/derived_copy_cleaner/requirements.txt

      - name: Rodar testes (pytest)
        run: python -m pytest agents/derived_copy_cleaner -v
